services:
  postgres:
    image: postgres:16-alpine
    container_name: rai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rai
      POSTGRES_PASSWORD: rai_dev_password
      POSTGRES_DB: rai
    ports:
      - "5432:5432"
    volumes:
      - rai_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rai -d rai"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  rai_postgres_data:
